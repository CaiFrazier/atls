name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Require the tag to match both package versions
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          spec=$(node -p "require('./packages/atls-spec/package.json').version")
          sdk=$(node -p "require('./packages/atls-sdk/package.json').version")
          dep=$(node -p "require('./packages/atls-sdk/package.json').dependencies['@caifrazier/atls-spec']")
          if [ "$tag" != "$spec" ] || [ "$tag" != "$sdk" ] || [ "$tag" != "$dep" ]; then
            echo "Tag v${tag} does not match @caifrazier/atls-spec@${spec} and @caifrazier/atls-sdk@${sdk} (dependency ${dep})."
            exit 1
          fi

      - name: Hotfix tags are not released
        if: contains(github.ref_name, '-')
        run: echo "Hotfix tag ${GITHUB_REF_NAME} matches v*.*.* and is not released. No GitHub Release is created and nothing is published to npm."

      - name: Install
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm build

      - name: Test
        if: ${{ !contains(github.ref_name, '-') }}
        run: pnpm test

      - name: Pack release tarballs
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          npm pack ./packages/atls-spec
          npm pack ./packages/atls-sdk
          test -f "caifrazier-atls-spec-${version}.tgz"
          test -f "caifrazier-atls-sdk-${version}.tgz"

      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          spec="caifrazier-atls-spec-${version}.tgz"
          sdk="caifrazier-atls-sdk-${version}.tgz"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Weekly release of @caifrazier/atls-spec and @caifrazier/atls-sdk ${version}.

          npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${spec} https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${sdk}

          npm currently has only the old 1.0.0-rc.1 release candidate. Use this release.
          EOF
          gh release create "$GITHUB_REF_NAME" "$spec" "$sdk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"

      - name: Publish to npm when NPM_TOKEN is set
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not set. Skipping npm publish."
            exit 0
          fi
          (cd packages/atls-spec && npm publish --access public --provenance)
          (cd packages/atls-sdk && npm publish --access public --provenance)
